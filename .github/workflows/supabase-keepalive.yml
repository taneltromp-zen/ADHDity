name: Supabase keep-alive

# Pings the Supabase project every 3 days so the free-tier project
# is not paused for inactivity.
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://gnqqxtqpsryejvtitwqz.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/recipes?select=*&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
